<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth-box { margin: 26px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth-box h2 { margin: 0 0 10px; font-size: 22px; }
    .auth-box p { margin: 8px 0; font-size: 15px; }
    .auth-box label { display: block; margin: 14px 0 6px; font-weight: 700; }
    .auth-box input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #72869c; border-radius: 8px; font: inherit; }
    .auth-box button { margin-top: 16px; padding: 11px 18px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    .auth-box button:disabled { cursor: wait; opacity: .6; }
    .auth-box .auth-error { color: #ffb5be; }
    .auth-box textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #72869c; border-radius: 8px; font: inherit; min-height: 90px; resize: vertical; }
    .note-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .note-controls button { margin-top: 10px; }
    .note-meta { font-size: 12px; overflow-wrap: anywhere; }
    #my-memos li { margin-top: 10px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 로그인 및 사용자별 접근 통제</div>
    <h1>내 자료실</h1>
    <p>로그인한 사용자에게만 서버 API가 학습용 가상 메모를 제공합니다.</p>
    <div class="notice">자료 API는 서버에서 로그인 토큰을 검증합니다. 로그인하지 않으면 자료를 반환하지 않습니다.</div>

    <section class="auth-box" aria-labelledby="auth-title">
      <h2 id="auth-title">이메일 로그인</h2>
      <p id="auth-status" role="status" aria-live="polite">로그인 상태 확인 중...</p>
      <form id="login-form" hidden>
        <label for="login-email">이메일</label>
        <input id="login-email" type="email" autocomplete="username" required>
        <label for="login-password">비밀번호</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="logged-in" hidden>
        <p id="logged-in-email"></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
    </section>

    <section class="auth-box" id="memos-section" hidden aria-labelledby="memos-title">
      <h2 id="memos-title">내 메모</h2>
      <p>로그인한 계정으로 가상 메모를 추가·수정·삭제합니다. 실제 개인정보는 입력하지 마세요.</p>
      <form id="memo-form">
        <label for="memo-title">제목</label>
        <input id="memo-title" required maxlength="200">
        <label for="memo-body">내용</label>
        <textarea id="memo-body" maxlength="10000"></textarea>
        <div class="note-controls">
          <button id="memo-save" type="submit">메모 추가</button>
          <button id="memo-cancel" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p id="memo-message" role="status" aria-live="polite"></p>
      <ul id="my-memos" aria-live="polite"><li>내 메모를 불러오는 중입니다.</li></ul>
    </section>

    <h2>기존 실습용 가상 메모</h2>
    <ul id="notes" aria-live="polite"><li>로그인하면 가상 메모를 불러옵니다.</li></ul>
  </main>

  <script type="module">
// The browser has no Supabase project key or Auth token. Auth is server-managed.
const form = document.querySelector('#login-form');
const emailInput = document.querySelector('#login-email');
const passwordInput = document.querySelector('#login-password');
const loginButton = document.querySelector('#login-button');
const loggedIn = document.querySelector('#logged-in');
const loggedInEmail = document.querySelector('#logged-in-email');
const logoutButton = document.querySelector('#logout-button');
const status = document.querySelector('#auth-status');
const errorMessage = document.querySelector('#auth-error');
const notesList = document.querySelector('#notes');
const memosSection = document.querySelector('#memos-section');
const memoForm = document.querySelector('#memo-form');
const memoTitle = document.querySelector('#memo-title');
const memoBody = document.querySelector('#memo-body');
const memoSave = document.querySelector('#memo-save');
const memoCancel = document.querySelector('#memo-cancel');
const memoMessage = document.querySelector('#memo-message');
const myMemos = document.querySelector('#my-memos');
let editingId = null;
let currentUser = null;
let notesRequestVersion = 0;
let memosRequestVersion = 0;
let sessionPromise = null;

function showError(message) {
  errorMessage.textContent = message;
  errorMessage.hidden = false;
}
function clearError() {
  errorMessage.textContent = '';
  errorMessage.hidden = true;
}
function renderAuth(user) {
  currentUser = user;
  const isLoggedIn = Boolean(user);
  form.hidden = isLoggedIn;
  memosSection.hidden = !isLoggedIn;
  if (!isLoggedIn) {
    editingId = null;
    memoForm.reset();
    memoSave.textContent = '메모 추가';
    memoCancel.hidden = true;
    memoMessage.textContent = '';
  }
  loggedIn.hidden = !isLoggedIn;
  loggedInEmail.textContent = isLoggedIn ? `로그인 계정: ${user.email || '이메일 미제공'}` : '';
  status.textContent = isLoggedIn ? '로그인 상태입니다.' : '로그아웃 상태입니다. 이메일로 로그인하세요.';
}
function setBusy(busy) {
  loginButton.disabled = busy;
  logoutButton.disabled = busy;
  emailInput.disabled = busy;
  passwordInput.disabled = busy;
}
function showNotesMessage(message) {
  const item = document.createElement('li');
  item.textContent = message;
  notesList.replaceChildren(item);
}
function showMemosMessage(message) {
  const item = document.createElement('li');
  item.textContent = message;
  myMemos.replaceChildren(item);
}

async function getServerSession() {
  const response = await fetch('/api/auth?action=session', {
    credentials: 'same-origin', cache: 'no-store',
  });
  if (response.status === 401) return null;
  if (!response.ok) throw new Error('로그인 상태를 확인할 수 없습니다.');
  const data = await response.json();
  if (!data.user || typeof data.user.email !== 'string') {
    throw new Error('로그인 상태 응답이 올바르지 않습니다.');
  }
  return data.user;
}
async function singleSessionCheck() {
  if (!sessionPromise) {
    sessionPromise = getServerSession().finally(() => { sessionPromise = null; });
  }
  return sessionPromise;
}
// Automatically retry once if the server refreshes an expired HttpOnly session.
async function authFetch(path, options = {}) {
  const settings = { credentials: 'same-origin', cache: 'no-store', ...options };
  let response = await fetch(path, settings);
  if (response.status === 401 && currentUser) {
    const previousUser = currentUser;
    const fresh = await singleSessionCheck();
    if (fresh && currentUser === previousUser) {
      response = await fetch(path, settings);
    } else if (!fresh && currentUser === previousUser) {
      renderAuth(null);
      void loadNotes(false);
      void loadUserMemos(false);
    }
  }
  return response;
}

async function loadNotes(active) {
  const version = ++notesRequestVersion;
  if (!active) {
    showNotesMessage('로그인하면 가상 메모를 볼 수 있습니다.');
    return;
  }
  showNotesMessage('가상 메모를 불러오는 중입니다.');
  try {
    const response = await authFetch('/api/notes');
    if (version !== notesRequestVersion) return;
    if (response.status === 401) {
      showNotesMessage('로그인이 만료됐습니다. 다시 로그인해 주세요.');
      return;
    }
    if (!response.ok) throw new Error('메모를 불러오지 못했습니다. 서버 설정을 확인해 주세요.');
    const data = await response.json();
    if (version !== notesRequestVersion) return;
    if (!Array.isArray(data.notes) || data.notes.length > 5) {
      throw new Error('가상 메모 목록 형식이 올바르지 않습니다.');
    }
    if (data.notes.length === 0) {
      showNotesMessage('이 계정의 가상 메모가 없습니다.');
      return;
    }
    const cards = data.notes.map(note => {
      if (typeof note.title !== 'string' || typeof note.content !== 'string') {
        throw new Error('메모 형식이 올바르지 않습니다.');
      }
      const card = document.createElement('li');
      const title = document.createElement('strong');
      const content = document.createElement('span');
      title.textContent = note.title;
      content.textContent = note.content;
      card.append(title, content);
      return card;
    });
    notesList.replaceChildren(...cards);
  } catch (error) {
    if (version === notesRequestVersion) showNotesMessage(error.message || '자료 요청에 실패했습니다.');
  }
}

async function memoRequest(path, method = 'GET', body = undefined) {
  const response = await authFetch(path, {
    method,
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    ...(body === undefined ? {} : { body: JSON.stringify(body) }),
  });
  if (response.status === 401) throw new Error('로그인이 만료됐습니다. 다시 로그인해 주세요.');
  if (response.status === 403) throw new Error('보안 검사가 요청을 거부했습니다.');
  if (response.status === 404) throw new Error('해당 메모가 없습니다.');
  if (!response.ok) throw new Error(`메모 요청이 실패했습니다. (HTTP ${response.status})`);
  return response.json();
}

async function loadUserMemos(active) {
  const version = ++memosRequestVersion;
  if (!active) {
    myMemos.replaceChildren();
    return;
  }
  showMemosMessage('내 메모를 불러오는 중입니다.');
  try {
    const items = await memoRequest('/api/memos');
    if (version !== memosRequestVersion) return;
    if (!Array.isArray(items)) throw new Error('메모 목록 형식이 올바르지 않습니다.');
    if (items.length === 0) {
      showMemosMessage('아직 작성한 메모가 없습니다.');
      return;
    }
    const elements = items.map(item => {
      const li = document.createElement('li');
      const heading = document.createElement('strong');
      heading.textContent = item.title;
      const content = document.createElement('span');
      content.textContent = item.body;
      const identifier = document.createElement('p');
      identifier.className = 'note-meta';
      identifier.textContent = `메모 ID: ${item.id}`;
      const actions = document.createElement('div');
      actions.className = 'note-controls';
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.textContent = '수정';
      edit.addEventListener('click', async () => {
        memoMessage.textContent = '';
        try {
          const current = await memoRequest(`/api/memos/${encodeURIComponent(item.id)}`);
          if (version !== memosRequestVersion) return;
          editingId = current.id;
          memoTitle.value = current.title;
          memoBody.value = current.body;
          memoSave.textContent = '수정 저장';
          memoCancel.hidden = false;
          memoTitle.focus();
        } catch (error) { memoMessage.textContent = error.message; }
      });
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = '삭제';
      remove.addEventListener('click', async () => {
        if (!window.confirm('이 가상 메모를 삭제할까요?')) return;
        memoMessage.textContent = '';
        try {
          await memoRequest(`/api/memos/${encodeURIComponent(item.id)}`, 'DELETE');
          if (editingId === item.id) resetMemoForm();
          memoMessage.textContent = '메모를 삭제했습니다.';
          await loadUserMemos(true);
        } catch (error) { memoMessage.textContent = error.message; }
      });
      actions.append(edit, remove);
      li.append(heading, content, identifier, actions);
      return li;
    });
    myMemos.replaceChildren(...elements);
  } catch (error) {
    if (version === memosRequestVersion) showMemosMessage(error.message);
  }
}

function resetMemoForm() {
  editingId = null;
  memoForm.reset();
  memoSave.textContent = '메모 추가';
  memoCancel.hidden = true;
}
memoCancel.addEventListener('click', resetMemoForm);
memoForm.addEventListener('submit', async event => {
  event.preventDefault();
  memoMessage.textContent = '';
  memoSave.disabled = true;
  try {
    const path = editingId ? `/api/memos/${encodeURIComponent(editingId)}` : '/api/memos';
    const method = editingId ? 'PUT' : 'POST';
    await memoRequest(path, method, { title: memoTitle.value.trim(), body: memoBody.value });
    resetMemoForm();
    memoMessage.textContent = method === 'POST' ? '메모를 추가했습니다.' : '메모를 수정했습니다.';
    await loadUserMemos(true);
  } catch (error) { memoMessage.textContent = error.message; }
  finally { memoSave.disabled = false; }
});

form.addEventListener('submit', async event => {
  event.preventDefault();
  clearError();
  setBusy(true);
  status.textContent = '로그인 요청 중...';
  try {
    const response = await fetch('/api/auth?action=login', {
      method: 'POST', credentials: 'same-origin', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
    });
    passwordInput.value = '';
    if (!response.ok) {
      renderAuth(null);
      showError(response.status === 401 ? '로그인 정보가 올바르지 않습니다.'
        : `로그인 요청에 실패했습니다. (HTTP ${response.status})`);
      return;
    }
    const data = await response.json();
    if (!data.user || typeof data.user.email !== 'string') {
      throw new Error('로그인 응답 형식이 올바르지 않습니다.');
    }
    renderAuth(data.user);
    void loadNotes(true);
    void loadUserMemos(true);
    status.textContent = '로그인에 성공했습니다.';
  } catch (error) {
    passwordInput.value = '';
    renderAuth(null);
    showError(error.message || '로그인 서버에 연결할 수 없습니다.');
  } finally { setBusy(false); }
});
logoutButton.addEventListener('click', async () => {
  clearError();
  setBusy(true);
  status.textContent = '로그아웃 요청 중...';
  // Invalidate in-flight reads before the logout request finishes.
  ++notesRequestVersion;
  ++memosRequestVersion;
  try {
    const response = await fetch('/api/auth?action=logout', {
      method: 'POST', credentials: 'same-origin', cache: 'no-store',
    });
    if (!response.ok) throw new Error(`로그아웃 실패 (HTTP ${response.status})`);
    renderAuth(null);
    void loadNotes(false);
    void loadUserMemos(false);
    status.textContent = '로그아웃했습니다.';
  } catch (error) {
    showError(error.message || '로그아웃 요청에 실패했습니다.');
    try {
      const user = await singleSessionCheck();
      renderAuth(user);
      void loadNotes(Boolean(user));
      void loadUserMemos(Boolean(user));
    } catch { renderAuth(null); }
  } finally { setBusy(false); }
});

try {
  const user = await singleSessionCheck();
  renderAuth(user);
  void loadNotes(Boolean(user));
  void loadUserMemos(Boolean(user));
} catch (error) {
  renderAuth(null);
  void loadNotes(false);
  void loadUserMemos(false);
  showError(error.message || '로그인 상태를 확인하지 못했습니다.');
}
  </script>

</body>
</html>
